<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Nova Armada</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#070B1A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@600;700;800&display=swap">
<style>
  /* Single dark look by design: deep-space ink with an ice-cyan accent. */
  @font-face { font-family: 'Exo 2'; font-weight: 100 900; font-display: swap; src: url(assets/fonts/exo2-latin.woff2) format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: 'Exo 2'; font-weight: 100 900; font-display: swap; src: url(assets/fonts/exo2-latin-ext.woff2) format('woff2');
    unicode-range: U+0100-02AF, U+0304, U+0308, U+0329, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
  :root { --ink: #070B1A; --text: #E8F1FF; color-scheme: dark; }
  html, body { height: 100%; margin: 0; background: var(--ink); color: var(--text); overflow: hidden; overscroll-behavior: none; }
  body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  #game { position: fixed; inset: 0; }
  #game canvas { display: block; }
  #safe-probe { position: fixed; visibility: hidden; pointer-events: none;
    padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  /* warm up both font subsets so canvas text has Turkish glyphs on first draw */
  #font-warm { position: absolute; left: -9999px; font-family: 'Exo 2', sans-serif; font-weight: 800; }
</style>
</head>
<body>
<div id="safe-probe"></div>
<div id="font-warm">ŞşĞğİıÇçÖöÜü NOVA</div>
<div id="game"></div>

</body>
</html>

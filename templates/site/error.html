{% extends "base.html" %}
{% load site_tags %}
{% block content %}
<section class="error-page theme-dark">
  <div class="container">
    <div class="error-page__code">{{ code|default:404 }}</div>
    {% t "hata.404_baslik" as err_title %}
    <h1 class="display t-xl" style="margin-top:12px">{{ err_title|fancy }}</h1>
    <p class="lead muted" style="margin:20px 0 36px;max-width:48ch">{% t "hata.404_metin" %}</p>
    <a class="btn btn--lg" href="/">{% t "genel.anasayfa" %} <svg class="ico"><use href="#i-arrow-up-right"/></svg></a>
  </div>
</section>
{% endblock %}

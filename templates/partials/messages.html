{% if messages %}
<div class="toast-stack" role="status" aria-live="polite">
  {% for message in messages %}
  <div class="toast{% if message.level_tag == 'error' %} toast--error{% endif %}">
    <span>{{ message }}</span>
    <button type="button" aria-label="Kapat"><svg class="ico"><use href="#i-x"/></svg></button>
  </div>
  {% endfor %}
</div>
{% endif %}

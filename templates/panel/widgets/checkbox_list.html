<div class="check-grid">{% for group, options, index in widget.optgroups %}{% for option in options %}<label class="check-chip"><input type="checkbox" name="{{ option.name }}" value="{{ option.value|stringformat:'s' }}" id="{{ option.attrs.id }}"{% if option.selected %} checked{% endif %}><span>{{ option.label }}</span></label>{% empty %}{% endfor %}{% empty %}<span class="muted">Seçenek yok.</span>{% endfor %}</div>
